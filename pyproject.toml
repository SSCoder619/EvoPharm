[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "evopharm-retail-erp"
version = "0.1.0"
description = "Commercial desktop retail ERP framework for EvoPharm."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "PySide6>=6.8",
    "SQLAlchemy>=2.0",
    "fastapi>=0.115",
    "opencv-python>=4.10",
    "paddleocr>=2.9",
    "openpyxl>=3.1",
    "reportlab>=4.2",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
